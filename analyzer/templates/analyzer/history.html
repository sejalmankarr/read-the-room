<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History | Read The Room</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; display: flex; justify-content: center; padding: 40px 16px; }
    .card { max-width: 560px; width: 100%; }
    a { color: #a29bfe; }
    .item { padding: 14px 16px; margin-top: 12px; border-radius: 10px; }
    .positive { background: #12372a; }
    .negative { background: #401b1b; }
    .neutral { background: #2a2a2a; }
    .meta { color: #aaa; font-size: 14px; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🕑 History</h1>
    <p><a href="{% url 'index' %}">← Back to analyzer</a></p>
    {% for a in analyses %}
      <div class="item {{ a.label }}">
        {{ a.text }}
        <div class="meta">{{ a.label|title }} · {{ a.score }}% · {{ a.created_at|date:"d M Y, H:i" }}</div>
      </div>
    {% empty %}
      <p>No analyses yet. Go analyze something!</p>
    {% endfor %}
  </div>
</body>
</html>
